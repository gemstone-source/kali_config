# Soft shadows and rounded window corners for the X11 i3 session.
backend = "xrender";

corner-radius = 14;
round-borders = 1;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];
round-borders-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.24;
shadow-offset-x = -8;
shadow-offset-y = -8;
shadow-color = "#000000";
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

fading = false;
vsync = true;
detect-rounded-corners = true;
